services:
  opencode2api:
    image: ghcr.io/moewsama/opencode2api:${OPENCODE2API_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      CONFIG_PATH: /var/lib/opencode2api/config.json
      LISTEN_ADDRESS: 0.0.0.0:8080
    ports:
      - "${OPENCODE2API_PORT:-8080}:8080"
    volumes:
      - ./config.json:/var/lib/opencode2api/config.json